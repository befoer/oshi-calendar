<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>推日 · 小红书配图</title>
<style>
  /* 小红书 3:4 配图，?page=1..6；配色同封面「薰衣草粉」 */
  @font-face { font-family: "ZiYuan Round"; font-weight: 900; src: url("/vfonts/资源圆体 Heavy.ttf"); }
  @font-face { font-family: "ZiYuan Round"; font-weight: 500; src: url("/vfonts/资源圆体 Medium.ttf"); }
  :root { --g1: #4f46e5; --g2: #8b5cf6; --g3: #ec4899; --outline: #3b2a8f; --em: #ffd6ec; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; }
  body { font-family: "ZiYuan Round", "Microsoft YaHei", sans-serif; color: #fff; position: relative;
    background: linear-gradient(160deg, var(--g1), var(--g2) 55%, var(--g3)); }
  .page { position: absolute; inset: 0; display: none; }
  .page.on { display: block; }
  .outline { text-shadow: 5px 0 0 var(--outline), -5px 0 0 var(--outline), 0 5px 0 var(--outline), 0 -5px 0 var(--outline),
    4px 4px 0 var(--outline), -4px -4px 0 var(--outline), 4px -4px 0 var(--outline), -4px 4px 0 var(--outline),
    0 14px 30px rgba(20,10,60,.4); }
  .spark { position: absolute; color: #fff; opacity: .55; font-size: 54px; }
  .logo { position: absolute; left: 60px; bottom: 54px; display: flex; align-items: center; gap: 16px; font-size: 36px; font-weight: 900; }
  .logo img { width: 60px; height: 60px; filter: drop-shadow(0 6px 16px rgba(0,0,0,.3)); }
  .logo span { opacity: .9; }

  /* ---- 第 1 张：封面 ---- */
  .cover .shot { position: absolute; left: -60px; top: 560px; width: 1500px; height: 1100px; border-radius: 36px; overflow: hidden;
    background: #f6f5fb; transform: rotate(-6deg); box-shadow: 0 40px 90px rgba(20,14,60,.4); }
  .cover .shot img { width: 100%; display: block; margin-top: -200px; }
  .cover .fade { position: absolute; inset: 0; background: linear-gradient(160deg, var(--g1), var(--g2) 55%, var(--g3));
    -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 44%, rgba(0,0,0,.55) 52%, transparent 60%); }
  .cover .dev { position: absolute; right: 56px; top: 64px; background: #fff; color: var(--g3); font-weight: 900; font-size: 40px;
    padding: 12px 30px; border-radius: 999px; transform: rotate(6deg); box-shadow: 0 14px 34px rgba(20,10,60,.3); }
  .cover .brand { position: absolute; left: 70px; top: 76px; display: flex; align-items: center; gap: 16px; font-size: 40px; font-weight: 900; }
  .cover .brand img { width: 68px; height: 68px; }
  .cover h1 { position: absolute; left: 64px; top: 210px; font-size: 158px; line-height: 1.14; font-weight: 900; white-space: nowrap; }
  .cover h1 em { font-style: normal; color: var(--em); }
  .cover .sub { position: absolute; left: 70px; top: 610px; background: #fff; color: #c0267a; font-weight: 900; font-size: 42px;
    padding: 16px 34px; border-radius: 26px; box-shadow: 0 16px 40px rgba(20,10,60,.35); }

  /* ---- 第 2–6 张：功能图 ---- */
  .feat .num { position: absolute; left: 60px; top: 70px; background: #fff; color: var(--g1); font-size: 34px; font-weight: 900;
    padding: 8px 26px; border-radius: 999px; }
  .feat h2 { position: absolute; left: 60px; right: 40px; top: 150px; font-size: 84px; line-height: 1.18; font-weight: 900; }
  .feat h2 em { font-style: normal; color: var(--em); }
  .feat p { position: absolute; left: 64px; right: 60px; top: 380px; font-size: 38px; line-height: 1.5; font-weight: 500; opacity: .95; }
  .feat .card { position: absolute; left: 60px; width: 960px; top: 500px; border-radius: 30px; border: 8px solid #fff;
    background-repeat: no-repeat; background-color: #f6f5fb; box-shadow: 0 30px 70px rgba(20,10,60,.4); }
</style>
</head>
<body>
  <section class="page cover" id="p1">
    <div class="shot"><img src="/stills/library-full.png" alt=""></div>
    <div class="fade"></div>
    <div class="brand outline"><img src="/icon.svg" alt="">推日 · 角色创作日历</div>
    <div class="dev">开发中 80%</div>
    <h1 class="outline">再也不错过<br><em>推的生日</em></h1>
    <div class="sub">搜名字 → 自动拿生日 → 提前提醒</div>
  </section>
  <section class="page feat" id="feat">
    <span class="spark" style="right:90px;top:90px">✦</span>
    <span class="spark" style="right:180px;top:200px;font-size:34px">✦</span>
    <div class="num"></div>
    <h2 class="outline"></h2>
    <p></p>
    <div class="card"></div>
    <div class="logo outline"><img src="/icon.svg" alt=""><span>推日 · 角色创作日历 · 开发中</span></div>
  </section>
  <script>
    // crop：截图里要展示的区域（应用视口 1600×900 的坐标 x, y, w, h），截图本身是 2400×1350
    const pages = {
      2: { title: "打开就知道<br><em>今天谁过生日</em>", text: "首页一句话：今天谁过生日、下一个轮到谁，寿星卡里还有角色口吻的留言。", img: "home.jpg", crop: [180, 40, 1000, 800] },
      3: { title: "搜名字<br><em>自动拿生日和 Tag</em>", text: "头像、生日、作品，连 AI 绘图 Tag 都一次找好。", img: "add.jpg", crop: [455, 230, 700, 560] },
      4: { title: "推太多？<br><em>名单丢给 AI 一次加完</em>", text: "11 位角色一次批量添加，每一条都能单独撤销。", img: "batch.jpg", crop: [700, 180, 900, 700] },
      5: { title: "月历里推的生日<br><em>一眼就认出</em>", text: "生日那天直接铺满推的头像，月底还有概览。", img: "calendar.jpg", crop: [380, 230, 1110, 640] },
      6: { title: "彩蛋：<br><em>还能和推聊天</em>", text: "AI 用角色的口吻回你，没灵感时还能让推出贺图点子。", img: "chat.jpg", crop: [430, 120, 740, 640] },
    };
    const n = Number(new URLSearchParams(location.search).get("page") || 1);
    if (n === 1) document.getElementById("p1").classList.add("on");
    else {
      const p = pages[n], sec = document.getElementById("feat");
      sec.classList.add("on");
      sec.querySelector(".num").textContent = `${String(n).padStart(2, "0")} / 06`;
      sec.querySelector("h2").innerHTML = p.title;
      sec.querySelector("p").textContent = p.text;
      const [x, y, w, h] = p.crop, scale = (960 - 16) / (w * 1.5);
      const card = sec.querySelector(".card");
      card.style.height = h * 1.5 * scale + 16 + "px";
      card.style.backgroundImage = `url(/xhs/${p.img})`;
      card.style.backgroundSize = `${2400 * scale}px auto`;
      card.style.backgroundPosition = `${-x * 1.5 * scale}px ${-y * 1.5 * scale}px`;
    }
  </script>
</body>
</html>
